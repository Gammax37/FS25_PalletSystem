name: "Rapport de bug"
description: "Signaler un problème avec FS25_PalletSystem"
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de remplir ce rapport ! Plus les informations
        sont précises, plus vite le bug pourra être identifié et corrigé.

  - type: dropdown
    id: zone
    attributes:
      label: Zone concernée
      description: Quelle partie du mod est touchée par le bug ?
      options:
        - Usine (ProductionPoint)
        - Bâtiment animaux (Husbandry)
        - Menu Réglages en jeu
        - Commandes console
        - Compatibilité FS25_ProductionStorageControl (PSC)
        - Système de remboursement / rebate
        - Persistance des réglages (sauvegarde/rechargement)
        - Autre
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Version du mod
      description: Numéro de version, tag, ou hash de commit si tu l'as compilé toi-même
      placeholder: "ex. 1.2.0 ou commit a1b2c3d"
    validations:
      required: false

  - type: input
    id: game-version
    attributes:
      label: Version de Farming Simulator 25
      placeholder: "ex. 1.4.0.0"
    validations:
      required: true

  - type: textarea
    id: other-mods
    attributes:
      label: Autres mods installés
      description: >-
        Liste des mods actifs, en particulier celui qui fournit le fillType
        EMPTYPALLET (indispensable pour reproduire la plupart des bugs).
      placeholder: "ex. FS25_PaletteVideMaker, FS25_ProductionStorageControl..."
    validations:
      required: true

  - type: dropdown
    id: game-mode
    attributes:
      label: Mode de jeu
      options:
        - Solo
        - Multijoueur - hôte
        - Multijoueur - client connecté à un serveur dédié
    validations:
      required: true

  - type: checkboxes
    id: settings-state
    attributes:
      label: Réglages actifs au moment du bug
      options:
        - label: Obligation "Animaux" activée
        - label: Obligation "Usines" activée
        - label: Le bâtiment concerné est désactivé individuellement (psToggleSpawner)

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Extrait du log.txt
      description: >-
        Colle les lignes pertinentes, idéalement celles contenant
        "PalletSystem" ou "PS-".
      render: shell
    validations:
      required: false

  - type: textarea
    id: pslist
    attributes:
      label: Sortie de psList
      description: Si pertinent, colle le résultat de la commande console psList.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Informations complémentaires
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Vérifications
      options:
        - label: "J'ai vérifié qu'aucune issue existante ne décrit déjà ce problème"
          required: true
